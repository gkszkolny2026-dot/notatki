<!DOCTYPE html>
<html lang="pl">
<head>
	<meta charset="UTF-8">
	<title>Listy</title>
</head>
<body>
	<h1>Listy nieuporządkowane</h1>
    <ul style="list-style-type: circle">
        <li>masło</li>
        <li>mleko</li>
        <li>bułki</li>
    </ul>
    <h1>lista numerowana</h1>
    <ol style="list-style-type: upper-roman">
        <li>pierwszy</li>
        <li>drugi</li>
        <li>trzeci</li>
    </ol>
    <h1>lista mieszana</h1>
    <ol>
        <li>tea:</li>
            <ul>
                <li>white</li>
                <li>green</li>
                <li>black</li>
            </ul>
        <li>coffee:</li>
            <ul>
                <li>white</li>
                <li>black</li>
            </ul>
        
    </ol>
    <h1>lista opisowa</h1>
    <dl>
        <dt>termin</dt>
           <dd>opis terminu</dd>
        <dt>temin</dt>
           <dd>opis terminu2</dd>
    </dl>
</body>
</html>
